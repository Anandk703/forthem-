<script>

// =====================================================
// FOR THEM - NEXUS AI CHATBOT
// =====================================================

// VERCEL BACKEND URL
const API_URL = "https://forthem-backend.vercel.app";


// =====================================================
// ELEMENTS
// =====================================================

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const chatMessages =
    document.getElementById("chatMessages");


// =====================================================
// LOAD USER
// =====================================================

function loadUser() {

    const userData =
        localStorage.getItem("forthem_user");

    if (!userData) {
        return;
    }

    try {

        const user =
            JSON.parse(userData);

        const name =
            user.name ||
            user.fullName ||
            user.username ||
            "User";

        document.getElementById(
            "sideUserName"
        ).textContent = name;

        document.getElementById(
            "userAvatar"
        ).textContent =
            name
                .trim()
                .charAt(0)
                .toUpperCase();

    }

    catch (error) {

        console.log(
            "User data unavailable."
        );

    }
}


// =====================================================
// SIDEBAR
// =====================================================

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


// =====================================================
// LOGOUT
// =====================================================

function logout() {

    localStorage.removeItem(
        "forthem_user"
    );

    localStorage.removeItem(
        "userName"
    );

    window.location.href =
        "login.html";

}


// =====================================================
// GET CURRENT TIME
// =====================================================

function getTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


// =====================================================
// ADD MESSAGE
// =====================================================

function addMessage(
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        `message ${
            type === "user"
                ? "user-message"
                : "ai-message"
        }`;

    const avatar =
        document.createElement("div");

    avatar.className =
        "message-avatar";

    avatar.textContent =
        type === "user"
            ? getUserInitial()
            : "🤖";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    bubble.textContent =
        text;

    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        type === "user"
            ? `YOU • ${getTime()}`
            : `NEXUS • ${getTime()}`;

    content.appendChild(
        bubble
    );

    content.appendChild(
        time
    );

    message.appendChild(
        avatar
    );

    message.appendChild(
        content
    );

    chatMessages.appendChild(
        message
    );

    scrollToBottom();

}


// =====================================================
// USER INITIAL
// =====================================================

function getUserInitial() {

    const userData =
        localStorage.getItem(
            "forthem_user"
        );

    if (!userData) {
        return "U";
    }

    try {

        const user =
            JSON.parse(userData);

        const name =
            user.name ||
            user.fullName ||
            user.username ||
            "User";

        return name
            .trim()
            .charAt(0)
            .toUpperCase();

    }

    catch {

        return "U";

    }

}


// =====================================================
// TYPING INDICATOR
// =====================================================

function showTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message ai-message";

    message.id =
        "typingMessage";

    message.innerHTML = `

        <div class="message-avatar">
            🤖
        </div>

        <div class="message-content">

            <div class="message-bubble">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>

    `;

    chatMessages.appendChild(
        message
    );

    scrollToBottom();

}


// =====================================================
// REMOVE TYPING
// =====================================================

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {

        typing.remove();

    }

}


// =====================================================
// SCROLL
// =====================================================

function scrollToBottom() {

    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

    const message =
        messageInput.value.trim();

    if (!message) {
        return;
    }


    // Add user message
    addMessage(
        message,
        "user"
    );


    // Clear input
    messageInput.value = "";


    // Reset textarea
    messageInput.style.height =
        "auto";


    // Disable button
    sendBtn.disabled = true;


    // Show typing
    showTyping();


    try {

        // Get user name
        let userName = "User";

        const storedUser =
            localStorage.getItem(
                "forthem_user"
            );

        if (storedUser) {

            try {

                const user =
                    JSON.parse(storedUser);

                userName =
                    user.name ||
                    user.fullName ||
                    user.username ||
                    "User";

            }

            catch {

                userName = "User";

            }

        }


        // ============================================
        // IMPORTANT:
        // CALL /api/chat
        // ============================================

        console.log(
            "📤 Sending NEXUS message to:",
            `${API_URL}/api/chat`
        );


        const response =
            await fetch(
                `${API_URL}/api/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: message,
                            userName: userName
                        })
                }
            );


        // Read response
        const data =
            await response.json();


        console.log(
            "📥 Backend response:",
            data
        );


        // Remove typing
        removeTyping();


        // Check HTTP status
        if (!response.ok) {

            throw new Error(
                data.message ||
                "Server error"
            );

        }


        // Check chatbot response
        if (
            !data.success ||
            !data.reply
        ) {

            throw new Error(
                "Invalid NEXUS response"
            );

        }


        // Add AI response
        addMessage(
            data.reply,
            "ai"
        );

    }


    catch (error) {

        console.error(
            "❌ NEXUS ERROR:",
            error
        );


        removeTyping();


        addMessage(
            "I'm having trouble connecting right now. Please try again in a moment. 💙",
            "ai"
        );

    }


    finally {

        sendBtn.disabled = false;

        messageInput.focus();

    }

}


// =====================================================
// QUICK QUESTION
// =====================================================

function sendQuickQuestion(
    question
) {

    messageInput.value =
        question;

    sendMessage();

}


// =====================================================
// ENTER TO SEND
// =====================================================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// =====================================================
// AUTO RESIZE TEXTAREA
// =====================================================

messageInput.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                100
            ) + "px";

    }
);


// =====================================================
// CLEAR CHAT
// =====================================================

function clearChat() {

    chatMessages.innerHTML = "";

    addMessage(
        "Chat cleared. I'm still here whenever you need support. 💙",
        "ai"
    );

}


// =====================================================
// INITIALIZE
// =====================================================

loadUser();

messageInput.focus();

</script>

<script src="chatbot.js"></script>
